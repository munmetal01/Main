<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>観たアニメ一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10151c;
    --panel: #161d25;
    --panel-alt: #1c242e;
    --line: #2a343f;
    --text: #e9edf1;
    --text-dim: #93a1ae;
    --text-faint: #5d6b78;
    --accent: #e0a458;
    --accent-soft: #7a5c39;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(16,21,28,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 24px 10px;
  }
  .header-inner{
    max-width:920px;
    margin:0 auto;
  }
  .title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:4px 20px;
    margin-bottom:8px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:1.25rem;
    margin:0;
    letter-spacing:0.04em;
  }
  .meta{
    color:var(--text-faint);
    font-size:0.75rem;
    letter-spacing:0.02em;
  }
  .meta strong{color:var(--accent-soft);font-weight:500;}

  .legend{
    color:var(--text-dim);
    font-size:0.72rem;
    line-height:1.5;
    margin:0 0 10px;
  }
  .legend .note{color:var(--text); display:block; margin-bottom:3px; font-size:0.76rem;}
  .legend .row{display:inline-flex; gap:5px; align-items:baseline; margin-right:14px;}
  .legend .stars{color:var(--accent); flex:0 0 auto;}

  .controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  #search{
    flex:1 1 220px;
    background:var(--panel-alt);
    border:1px solid var(--line);
    color:var(--text);
    padding:6px 12px;
    border-radius:3px;
    font-size:0.85rem;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease;
  }
  #search::placeholder{color:var(--text-faint);}
  #search:focus{border-color:var(--accent-soft);}

  .chip{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:5px 12px;
    border-radius:3px;
    font-size:0.78rem;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .chip:hover{border-color:var(--accent-soft); color:var(--text);}
  .chip.active{
    background:var(--accent-soft);
    border-color:var(--accent-soft);
    color:var(--bg);
    font-weight:500;
  }

  /* ---------- year jump strip ---------- */
  #yearstrip{
    max-width:920px;
    margin:10px auto 0;
    display:flex;
    gap:2px 10px;
    flex-wrap:wrap;
    font-size:0.7rem;
    color:var(--text-faint);
    padding-top:8px;
    border-top:1px solid var(--line);
  }
  #yearstrip a{
    text-decoration:none;
    color:var(--text-faint);
    padding:2px 3px;
  }
  #yearstrip a:hover{color:var(--accent);}

  /* ---------- body ---------- */
  main{
    max-width:920px;
    margin:0 auto;
    padding:10px 24px 90px;
  }

  .year-block{
    display:flex;
    gap:28px;
    padding:34px 0 8px;
    border-top:1px solid var(--line);
    scroll-margin-top:150px;
  }
  .year-block:first-child{border-top:none;}

  .year-label{
    flex:0 0 96px;
    font-family:'Shippori Mincho', serif;
    font-size:2.1rem;
    font-weight:700;
    color:var(--accent);
    line-height:1;
    padding-top:2px;
  }
  .year-label span{
    display:block;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.72rem;
    font-weight:400;
    color:var(--text-faint);
    margin-top:6px;
    letter-spacing:0.05em;
  }

  .entries{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px 28px;
  }
  .entry{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:7px 0;
    border-bottom:1px solid rgba(42,52,63,0.5);
  }
  .entry-title{
    font-size:0.92rem;
    color:var(--text);
  }
  .meter{
    flex:0 0 auto;
    font-size:0.8rem;
    letter-spacing:1px;
    color:var(--accent);
    white-space:nowrap;
  }

  .hidden{display:none !important;}

  #empty-state{
    display:none;
    text-align:center;
    color:var(--text-faint);
    padding:60px 0;
    font-size:0.9rem;
  }

  @media (max-width:640px){
    .entries{grid-template-columns:1fr;}
    .year-block{gap:16px; padding:26px 0 4px;}
    .year-label{flex-basis:64px; font-size:1.5rem;}
    h1{font-size:1.4rem;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title-row">
      <h1>観たアニメ一覧</h1>
      <div class="meta">1989年 〜 2026年 ・ <strong id="totalCount">0</strong> 作品</div>
    </div>
    <div class="legend">
      <span class="note">リアルタイムで見ていないものが多いかも？</span>
      <span class="row"><span class="stars">☆</span>一応全部観たはず</span><span class="row"><span class="stars">☆☆</span>全部観た(見てないシーズンもあるかも)</span><span class="row"><span class="stars">☆☆☆</span>２周以上観た</span>
    </div>
    <div class="controls">
      <input id="search" type="text" placeholder="タイトルで検索…">
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="3">☆☆☆</button>
      <button class="chip" data-filter="2">☆☆</button>
      <button class="chip" data-filter="1">☆</button>
      <button class="chip" data-filter="0">未評価</button>
    </div>
  </div>
  <div id="yearstrip"></div>
</header>

<main>
  <div id="listing"></div>
  <div id="empty-state">該当する作品が見つかりませんでした</div>
</main>

const years = [...new Set(DATA.map(d => d[0]))].sort((a,b) => a-b);

const yearstrip = document.getElementById('yearstrip');
years.forEach(y => {
  const a = document.createElement('a');
  a.href = '#y' + y;
  a.textContent = y;
  yearstrip.appendChild(a);
});

const listing = document.getElementById('listing');
const blocksByYear = {};

years.forEach(y => {
  const block = document.createElement('div');
  block.className = 'year-block';
  block.id = 'y' + y;

  const label = document.createElement('div');
  label.className = 'year-label';
  label.innerHTML = y + '<span>年</span>';
  block.appendChild(label);

  const entries = document.createElement('div');
  entries.className = 'entries';
  block.appendChild(entries);

  blocksByYear[y] = { block, entries };
  listing.appendChild(block);
});

function meterHTML(stars){
  if(stars === 0) return '';
  return `<span class="meter">${'☆'.repeat(stars)}</span>`;
}

const rowEls = [];

DATA.forEach(([year, title, stars]) => {
  const row = document.createElement('div');
  row.className = 'entry';
  row.dataset.stars = stars;
  row.dataset.title = title.toLowerCase();
  row.innerHTML = `<span class="entry-title">${title}</span>${meterHTML(stars)}`;
  blocksByYear[year].entries.appendChild(row);
  rowEls.push(row);
});

let activeFilter = 'all';
let query = '';

function applyFilters(){
  let anyVisible = false;
  rowEls.forEach(row => {
    const matchesFilter = activeFilter === 'all' || row.dataset.stars === activeFilter;
    const matchesQuery = !query || row.dataset.title.includes(query);
    const show = matchesFilter && matchesQuery;
    row.classList.toggle('hidden', !show);
    if(show) anyVisible = true;
  });
  years.forEach(y => {
    const { block, entries } = blocksByYear[y];
    const visibleCount = [...entries.children].filter(r => !r.classList.contains('hidden')).length;
    block.classList.toggle('hidden', visibleCount === 0);
  });
  document.getElementById('empty-state').style.display = anyVisible ? 'none' : 'block';
}

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  applyFilters();
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    applyFilters();
  });
});

</html>
